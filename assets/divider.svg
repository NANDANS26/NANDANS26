<svg width="100%" height="6" viewBox="0 0 1000 6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider">
  <rect width="1000" height="1" y="2.5" fill="#1b232b" />
  <rect width="140" height="2" y="2" rx="1" fill="#00D9FF" opacity="0.85">
    <animate attributeName="x" from="-140" to="1000" dur="5s" repeatCount="indefinite" />
  </rect>
  <circle cx="500" cy="3" r="2.2" fill="#6EE7F9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
  </circle>
</svg>
